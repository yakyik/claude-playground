# Profile: Kubernetes Staging
# Overrides base config for services reachable via k8s internal DNS.

services:
  - name: analytics-db
    url: http://analytics-db.bastion.svc.cluster.local:5432

  - name: metrics-db
    url: http://metrics-db.bastion.svc.cluster.local:5432

  - name: users
    url: http://users-api.bastion.svc.cluster.local:8080

  - name: inventory
    url: http://inventory-api.bastion.svc.cluster.local:8080

  - name: billing
    url: http://billing-api.bastion.svc.cluster.local:8080
